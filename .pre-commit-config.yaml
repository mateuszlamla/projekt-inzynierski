# Instalacja: pip install -r backend/requirements-dev.txt && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        name: Ruff linter
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: Ruff formatter
        files: ^backend/
